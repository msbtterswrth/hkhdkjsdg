version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: drupal_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - /configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /configs/web:/var/www/html
    depends_on:
      - drupal

  drupal:
    image: drupal:10-apache
    container_name: drupal_app
    restart: always
    volumes:
      - /configs/web:/var/www/html
    environment:
      - DRUPAL_DB_HOST=db
      - DRUPAL_DB_USER=drupal
      - DRUPAL_DB_PASSWORD=
      - DRUPAL_DB_NAME=drupal
    depends_on:
      - db

  db:
    image: mysql:8
    container_name: drupal_db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_DATABASE=drupal
      - MYSQL_USER=drupal
      - MYSQL_PASSWORD=
    volumes:
      - /configs/db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: drupal_phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - MYSQL_ROOT_PASSWORD=
    depends_on:
      - db
