      "//cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.6.0/slick.min.css": {}
      "//cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.6.0/slick-theme.min.css":
        {}
  dependencies:
    - core/jquery
